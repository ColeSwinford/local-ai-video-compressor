<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft, physical drop shadow (no neon glow) -->
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Classic Deep Navy Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#11213A" />
  
  <!-- Subtle physical edge for depth -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#1A2D4C" stroke-width="4" />

  <!-- Original File Size (Dashed Border) -->
  <rect x="88" y="136" width="336" height="240" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="14 14" />

  <!-- Compressed Target Size (Solid Warm Tan Block) -->
  <rect x="144" y="176" width="224" height="160" rx="16" fill="#D9C5A3" filter="url(#paper-shadow)" />

  <!-- Play Symbol (Punched out to Navy base) -->
  <path d="M 238 230 L 282 256 L 238 282 Z" fill="#11213A" stroke="#11213A" stroke-width="6" stroke-linejoin="round" />
</svg>
